# Meridian Client — Local Test Configuration
# ==========================================
# listen_addr: 0.0.0.0:1080 — serves the entire LAN (all devices on the same network)
# listen_addr: 127.0.0.1:1080 — localhost only

server_addr: "127.0.0.1:15443"
transport: "QUIC"
cipher_suite: 1
password: "test-password-local"

# Disable REALITY for local testing
sni_spoof: "localhost"
reality_mode: false
reality_short_id: 0
reality_max_time: 0

# Anti-Detection (relaxed)
fingerprint: "chrome_win"
padding_mode: "none"
base_payload_size: 1400
max_payload_size: 1452
direction_balance: false
timing_jitter_ms: 0.0

# Connection
keepalive_interval: "30s"
handshake_timeout: "10s"
stream_window: 1048576
max_concurrent_streams: 100
session_lifetime: "1h"
dial_timeout: "15s"

# Local SOCKS5 Proxy
# 0.0.0.0 allows all LAN devices (phones, tablets, other PCs) to connect
listen_addr: "0.0.0.0:1080"
