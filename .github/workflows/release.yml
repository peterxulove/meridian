name: 自动构建并发布 Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 / v1.2.3 等标签时触发

  workflow_dispatch:  # 允许手动在 Actions 页面触发

permissions:
  contents: write    # 需要写权限才能创建 Release 和上传产物

jobs:
  build:
    name: 交叉编译 (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # ── macOS ──────────────────────────────────────────
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            desc: "macOS Apple Silicon (M1/M2/M3)"

          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            desc: "macOS Intel"

          # ── Linux ──────────────────────────────────────────
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            desc: "Linux ARM64 (树莓派 / ARM 服务器)"

          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            desc: "Linux x86_64"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./test/integration/ -v -timeout 60s

      - name: 编译服务端
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/meridian-server-${{ matrix.suffix }} \
            ./cmd/meridian-server/

      - name: 编译客户端
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/meridian-client-${{ matrix.suffix }} \
            ./cmd/meridian-client/

      - name: 验证产物
        run: |
          echo "=== 编译产物 ==="
          ls -lh dist/
          file dist/*

      - name: 上传构建产物（供 release job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/
          retention-days: 1

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: build    # 等所有平台编译完成再发布

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载全部编译产物
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      - name: 显示待发布文件
        run: |
          echo "=== 待发布文件 ==="
          ls -lh dist/

      - name: 生成 SHA256 校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 从 CHANGELOG 或 tag message 提取 Release Notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="## Meridian ${TAG}

          ### 下载说明

          | 文件 | 平台 | 架构 |
          |------|------|------|
          | \`meridian-server-darwin-arm64\` | macOS | Apple Silicon (M1/M2/M3) |
          | \`meridian-client-darwin-arm64\` | macOS | Apple Silicon (M1/M2/M3) |
          | \`meridian-server-darwin-amd64\` | macOS | Intel x86_64 |
          | \`meridian-client-darwin-amd64\` | macOS | Intel x86_64 |
          | \`meridian-server-linux-arm64\`  | Linux | ARM64（静态链接）|
          | \`meridian-client-linux-arm64\`  | Linux | ARM64（静态链接）|
          | \`meridian-server-linux-amd64\`  | Linux | x86_64（静态链接）|
          | \`meridian-client-linux-amd64\`  | Linux | x86_64（静态链接）|
          | \`SHA256SUMS\` | 全平台 | SHA256 校验和 |

          ### 校验文件完整性

          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`

          ### 快速使用

          \`\`\`bash
          # Linux ARM64 服务端
          chmod +x meridian-server-linux-arm64
          ./meridian-server-linux-arm64 -config server.yaml

          # macOS Apple Silicon 客户端
          chmod +x meridian-client-darwin-arm64
          ./meridian-client-darwin-arm64 -config client.yaml
          \`\`\`

          > Linux 版本为完全静态链接，无需安装任何运行时依赖。"

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: "Meridian ${{ github.ref_name }}"
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/meridian-server-darwin-arm64
            dist/meridian-client-darwin-arm64
            dist/meridian-server-darwin-amd64
            dist/meridian-client-darwin-amd64
            dist/meridian-server-linux-arm64
            dist/meridian-client-linux-arm64
            dist/meridian-server-linux-amd64
            dist/meridian-client-linux-amd64
            dist/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}
